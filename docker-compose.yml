version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: woms-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: warehouse_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d warehouse_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: woms-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: woms-api
    restart: always
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "Warehouse Order Management System"
      APP_ENV: "production"
      DEBUG: "false"
      USE_SQLITE: "false"
      DATABASE_URL: "postgresql+asyncpg://postgres:postgrespassword@postgres:5432/warehouse_db"
      DATABASE_URL_SYNC: "postgresql://postgres:postgrespassword@postgres:5432/warehouse_db"
      REDIS_URL: "redis://redis:6379/0"
      USE_FAKE_REDIS: "false"
      DEFAULT_ROUTING_STRATEGY: "OR_TOOLS_LP"
      MAX_WAREHOUSE_SPLITS: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
